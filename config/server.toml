# Server configuration as committed: safe defaults for a checkout (everything listens on
# loopback, no password-less logins, no developer tools). Paths are relative to the working
# directory (the repo root when started with `cargo run`). Override the file location with
# POE_CONFIG=<path>.
# Development setups keep their own copy in the git-ignored runtime/server.dev.toml
# (`python3 scripts/dev-config.py` writes it) and start with POE_CONFIG=runtime/server.dev.toml;
# docs/guides/setup.md. To serve other machines see docs/guides/hosting.md.

[game]
# The supported client build: versions/<version>.toml is its single definition (depots, exe
# checksum, opcode folder, signature table, accepted client hashes; docs/guides/new-game-version.md).
# `{version}` in the path settings below is replaced by it.
version = "0.5.5f"
# Provided copy of the client install; game data is read from <game_dir>/Bundles2.
game_dir = "GameFiles"
# Community .datc64 schema (third_party/fetch-tools.sh downloads it).
schema = "third_party/dat-schema/schema-poe2.min.json"
# Opcode tables: default = the version file's [protocol] opcodes. Set only to try other tables.
# protocol_dir = "modules/protocol/opcodes/<version>"

[network]
# Host the clients are sent to: written into gateway_list.txt by `cargo xtask deploy-client`
# (login server) and sent in InstanceDetails (instance server). Use the machine's LAN/public
# address for remote clients (docs/guides/hosting.md).
public_host = "127.0.0.1"

[network.login]
# Loopback: only this machine can connect. Use "0.0.0.0:20481" to listen on every interface.
bind = "127.0.0.1:20481"
# Official servers send 0x0017 0x0014 after InstanceDetails, which makes the client close its
# login connection. Our in-game transfers go through that connection, so keep this off.
close_after_handoff = false
# Port written into the client's gateway entry and trusted list when it differs from the bind
# port (port forwarding, docs/guides/hosting.md). Default: the bind port.
# public_port = 20481
# Limits before a client has logged in (a slow or idle socket must not pin memory and tasks).
# Longest time one message may take to arrive completely, the key exchange included (seconds, 0 = off).
pre_auth_read_timeout_secs = 15
# Longest time from connecting to a successful login (seconds, 0 = off).
pre_auth_login_timeout_secs = 60
# Most bytes held for an incomplete message (bytes, 0 = off).
pre_auth_max_buffer = 65536
# Most connections that have not logged in yet: in total and per client IP (IPv6: per /64). 0 = off.
max_pre_auth_connections = 256
max_pre_auth_per_ip = 16

[network.instance]
bind = "127.0.0.1:6112"
# Port the login server tells the client to connect to; also where the DLL sends position
# reports (`cargo xtask deploy-client` writes it into the DLL config).
public_port = 6112
# Limits before a client has shown its ticket (as for the login server above).
pre_auth_read_timeout_secs = 15
pre_auth_max_buffer = 65536
max_pre_auth_connections = 256
max_pre_auth_per_ip = 16

[instance]
# Empty instances close after this many minutes (towns and hideouts stay open); 0 = never.
idle_minutes = 15
# Simulation frame interval in ms (one 0x2f7 tick marker per frame; also sent in
# InitialState as the frame length).
tick_ms = 33
# First entity id of an instance's counter, shared by all its players (official: players start
# at 12000; the area's own objects have lower ids).
first_entity_id = 12000

[travel]
# Reaches of gates, waypoints and checkpoints, in cells (docs/re/world-travel.md in the hub).
# A click acts from interact_range; from farther the player walks there first (official: 26).
interact_range = 26
# A waypoint or checkpoint this close counts as touched (official: inside about 40).
touch_range = 40
# The WorldAreas.Act values `unlock <character> all` covers: acts 1-4 and the interludes (6).
acts = [1, 2, 3, 4, 6]
# Objects not spawned: a type path or .ao path containing one of these stays out of the world.
# Wells: no capture holds their blob and the ones tried hang the client's area load.
skip_objects = ["HealingWell"]

[movement]
# Movement facts the server sends that the game data does not name directly (the movement itself is
# the client's code behind the movement seam: docs/architecture/instance-world.md in the hub).
# BuffDefinitions rows of the three buffs a sprint adds.
sprint_buff_rows = [2758, 2737, 2853]
# Frames the client's WashedUp action plays: a washed-up character stands until it ends.
wake_frames = 187

[dev]
# Development tools; none are needed for normal play.
# Listen for the client DLL's UDP datagrams on the instance port (position reports, overlay
# commands). Reports are only read by the drift checker; they never move the player. Off here;
# the dev config turns it on.
position_sync = false
# Drift checker: log the server's player position against the client's reported one (cells)
# every drift_interval_ms. Needs position_sync and the DLL.
drift_check = false
drift_interval_ms = 1000
# Debug link for the client DLL overlay (state view, command registry, instance list, server
# commands from the overlay). Authenticated per session (HMAC), so remote players work too.
# Off here; the dev config turns it on.
debug_link = false

[terrain]
# The server is the terrain authority: it generates every new instance (poe-world), forces its
# layout on the client, and uses its own collision grid, spawn layout and travel objects
# (docs/architecture/instance-world.md in the hub). An area the generator cannot make runs
# without a server grid, terrain check or travel objects.
# Seconds the client has to report its terrain hashes after the area load started; no report counts
# as a terrain mismatch. A player whose tile or doodad hash differs from the
# server's is kicked to the previous instance, else the act's town, else character select
# (docs/protocol/instance.md in the hub). 0 = wait forever.
hash_timeout_secs = 30

[cluster]
# Identity of this cluster (docs/architecture/accounts.md). Login tokens carry it; a token
# issued under another id does not validate here. Change it to invalidate every saved login.
id = "local"

[commands]
# Prefix for server commands typed in chat (`/` stays with the client's own commands).
prefix = "!"
# Every admin command is appended here (time, account, command, result). Empty = off.
audit_log = "runtime/admin-audit.log"

[server]
# What an admin's "restart" (web admin) does after the graceful shutdown: "exec" = the process
# starts itself again; "exit" = exit code 75 for a supervisor to restart. A stop exits with 0.
# docs/guides/server-admin.md
restart_mode = "exec"
# Message of the day: plain text (at most 280 characters, line breaks allowed) shown by the
# launcher's Home page (GET /api/v1/server, field `motd`). Empty = none. The web admin edits it
# live (Dashboard card or the config editor) and writes it back into this file.
motd = ""   # default: none

[web]
# HTTP API and web admin (docs/architecture/web-api.md). Passwords travel in request bodies:
# keep the bind on loopback, or put a TLS reverse proxy in front.
enabled = true
bind = "127.0.0.1:8080"
# Directory with the built web admin (served at / with an index.html fallback). Empty = none.
static_dir = "modules/web-admin/dist"
# Browser origins allowed to call the API, e.g. ["http://localhost:5173"] for the Vite dev server.
cors_origins = []
# Recent log events kept for the live log viewer.
log_buffer = 2000
# Lifetime (seconds) of the single-use token the launcher's "Open web admin" button hands the
# browser (POST /api/v1/web-token); it is redeemed at once, so keep it short.
web_token_ttl_secs = 60
# The web admin's config editor (Config page): view, validate and save THIS file (the one the
# server was started with: POE_CONFIG or config/server.toml). false = saving is refused.
config_editor = true   # default
# Each save keeps the previous file here as <name>.<timestamp>; the oldest beyond config_backup_keep go.
config_backup_dir = "runtime/config-backups"   # default
config_backup_keep = 20   # default

[metrics]
# Dashboard charts (GET /api/v1/admin/metrics): players, instances, tick time, memory and CPU of
# the server process are sampled into a ring buffer in memory (lost on a restart).
enabled = true   # default
interval_secs = 5   # default; 1 to 3600
retention_hours = 24   # default; 1 to 168

[scheduler]
# Scheduled tasks (web admin, Schedule page; stored in the database): currently scheduled
# restarts. A run found later than missed_grace_secs after its time (the machine slept, the server
# was down) is skipped and recorded as missed, never run late.
enabled = true   # default
history_keep = 100   # default: runs kept per task
missed_grace_secs = 120   # default; 1 to 86400

[mods]
# Server mods (docs/guides/modding.md, `poe-server mod list|install|enable|disable|verify`).
# The folder holds state.toml (enabled mods in load order), one folder per mod and
# packages/<id>-<version>.zip (what clients download). Changing mods needs a restart.
dir = "mods"   # default
# Check at login that the client runs exactly the client mods this server requires (side client or
# both, enabled). Only active when <dir>/state.toml exists. A client without the mod hook's
# report (old hook) is refused when the server requires mods.
require_client_mods = true   # default
# Allow client mods the server does not list. false: any extra client mod refuses the login.
allow_extra_client_mods = false   # default
# More download addresses advertised for every offered mod ({id} and {version} are replaced).
extra_urls = []   # default
# Seconds to wait for the client's mod report after it entered the instance; 1 to 120.
report_wait_secs = 15   # default
# A mod whose callbacks fail this many times in a row is disabled; 0 = never.
max_failures = 5   # default
# A mod callback slower than this (milliseconds) is logged and counts as a failure; 0 = no limit.
callback_budget_ms = 50   # default
# Settings handed to one mod (read with config_get):
# [mods.config.hello-server]
# greeting = "Hello"

[database]
path = "runtime/server.sqlite"

[accounts]
# Accounts have a username and a password (`account create <name> <password>`, admins by role:
# `account role <name> admin`; docs/guides/server-admin.md). Every login is an account name and
# password (or a saved Remember Me token); a Steam login (0x0005) is always refused. Every account
# has full game access and the official four stash tabs.
# Whether POST /api/v1/register may create accounts (docs/architecture/web-api.md); server commands always can.
open_registration = false
# How long a "Remember Me" login stays valid (days).
remember_days = 30
# Character slots per account (sent to the client and enforced on creation).
max_characters = 24
# Two account flag bytes sent with the authentication result; the client splits them into
# bits (docs/protocol/login.md). Byte 0 bits 2/3/4/7 open the terms-of-use window, the cheating
# warning, the RMT warning and "update required": keep them clear. Bit 6 shows the red
# "suspicious activity" strict-unlock banner on the character select screen: keep it clear too.
flags = [0x23, 0x03]

[security]
# Rate limiting of password logins: the game login and the web API (/login, /password). Failed
# attempts are counted per account name and per client IP in a sliding window; at the limit the
# key is locked and further attempts are refused (game: "You have attempted to log in too
# often", web: HTTP 429 with Retry-After) before the password is checked. 0 = limit off.
# Saved-token logins are not counted. See docs/guides/server-admin.md.
login_max_failures_per_account = 5     # defaults shown
login_max_failures_per_ip = 20
login_failure_window_secs = 300
login_lockout_secs = 300
# Behind a TLS reverse proxy that sets X-Forwarded-For: use it as the web API client IP.
trust_forwarded_for = false
# Refuse a client whose exe is not a known build of [game] version (its client_hash, a SHA-256
# of the exe, is not in versions/<version>.toml [client] hashes): the client shows "There has
# been a patch that you need to update to". true = accept any build (try an unlisted one; the
# server logs the hash). While the version file's hashes_confirmed is false nothing is refused.
allow_unknown_client = false

[gateway]
# Entry written into GameFiles/gateway_list.txt (replaces the official list while deployed).
region = "Local"
display_name = "Local Server"

[logging]
# tracing EnvFilter syntax; RUST_LOG overrides it.
filter = "info,poe_net=debug"

# Player inventories sent on instance entry (one per Inventories.dat row; the client's UI
# looks each slot up and fails on a missing one). Sizes are [width, height].
[inventories]
default_size = [1, 1]
# Row 26 is excluded by the client's inventory registry.
skip = ["StashInventoryId"]

[inventories.sizes]
MainInventory1 = [12, 5]
BodyArmour1 = [2, 3]
Weapon1 = [2, 4]
Offhand1 = [2, 4]
Weapon2 = [2, 4]
Offhand2 = [2, 4]
Helm1 = [2, 2]
Gloves1 = [2, 2]
Boots1 = [2, 2]
Belt1 = [2, 1]
Flask1 = [5, 1]

# Player start position, on the layout the server generated. The player starts on the area's start tile, or else on the playable tile nearest the map centre.
[spawn]
# First visit plays the washed-up opening (new characters on the Riverbank).
intro_areas = ["G1_1"]

# A player joining an instance never stands closer than this many grid cells (about a third of a
# tile) to a player already there: a spawn that close moves to the nearest free walkable cell
# (0 = off).
player_spacing = 8

# Start tile per area, and the start cell inside it in the tile's own orientation (grid cells
# from its corner); the spawn is then snapped to the nearest walkable cell. `facing` (radians, in
# the tile's own orientation) is the direction a character starting there looks in.
# The Riverbank: washed up on the shore beside the intro tree (official cell and facing).
[spawn.start_tiles.G1_1]
tile = "Intro_Tree"
point = [8, 31]
facing = 3.46041

# Chat: the channel given to "join any" requests (global/trade); lines are routed by channel.
[chat]
default_channel = 1

# Player characters: skills every character has (GrantedEffects ids, level 1). Basic actions
# such as Move come from the class template and are not listed here.
# New characters start in start_area (WorldAreas id) unless their start state has a hub area.
[player]
innate_skills = ["DodgeRollPlayer"]
start_area = "G1_1"
# Animation set names other players' clients get for a character (main hand, off hand, default;
# official: weapon-dependent, `BowTown` ..., `UnarmedTown`, `default`). Characters have no
# equipment yet, so all are unarmed.
animation_sets = ["UnarmedTown", "UnarmedTown", "default"]
